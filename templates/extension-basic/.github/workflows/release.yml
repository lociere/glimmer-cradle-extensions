name: 发布 Extension

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 验证公开 SDK 可取得性
        run: |
          SDK_VERSION="$(node -p 'require("./package.json").peerDependencies["@glimmer-cradle/extension-sdk"]')"
          test "$(npm view "@glimmer-cradle/extension-sdk@${SDK_VERSION}" version)" = "$SDK_VERSION"
          test "$(node -p 'require("./node_modules/@glimmer-cradle/extension-sdk/package.json").version')" = "$SDK_VERSION"
      - run: pnpm release:prepare
        env:
          GCEX_PLATFORM: ${{ vars.GCEX_PLATFORM || 'any' }}
          GCEX_CHANNEL: ${{ vars.GCEX_CHANNEL || 'stable' }}
      - name: 验证发布摘要
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: 生成 GitHub provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release/*
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
