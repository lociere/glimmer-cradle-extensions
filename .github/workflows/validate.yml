name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lociere/glimmer-cradle
          path: glimmer-cradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: glimmer-cradle
      - run: pnpm build:extension-tooling
        working-directory: glimmer-cradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm link:local-sdk ${{ github.workspace }}/glimmer-cradle
      - run: pnpm validate
